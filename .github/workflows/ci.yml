name: Schema Compatibility CI

on:
  pull_request:
    branches: [ main ]

jobs:
  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Start Ephemeral Kafka & Schema Registry
        run: |
          cat << 'EOF' > docker-compose-ci.yml
          version: '3.8'
          services:
            zookeeper:
              image: confluentinc/cp-zookeeper:7.3.0
              environment:
                ZOOKEEPER_CLIENT_PORT: 2181
                ZOOKEEPER_TICK_TIME: 2000
            kafka:
              image: confluentinc/cp-kafka:7.3.0
              depends_on:
                - zookeeper
              environment:
                KAFKA_BROKER_ID: 1
                KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
                KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
                KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
                KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
                KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            registry:
              image: confluentinc/cp-schema-registry:7.3.0
              depends_on:
                - kafka
              ports:
                - "8081:8081"
              environment:
                SCHEMA_REGISTRY_HOST_NAME: registry
                SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
          EOF
          
          docker compose -f docker-compose-ci.yml up -d
          
          echo "Waiting for Schema Registry..."
          timeout 90 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' localhost:8081)" != "200" ]]; do sleep 2; done' || {
            docker compose -f docker-compose-ci.yml logs
            exit 1
          }

      - name: Register V2 Baseline
        run: |
          if [ ! -f schemas/transactions_v2.avsc ]; then echo "Baseline schema missing"; exit 1; fi
          PAYLOAD=$(jq -Rs '{schema: .}' schemas/transactions_v2.avsc)
          curl -X POST -H "Content-Type: application/vnd.schemaregistry.v1+json" \
            --data "$PAYLOAD" \
            http://localhost:8081/subjects/payments.public.transactions-value/versions

      - name: Test Proposed Schema
        run: |
          if [ ! -f schemas/transactions_proposed.avsc ]; then
            echo "No proposed schema found. Skipping check."
            exit 0
          fi
          PAYLOAD=$(jq -Rs '{schema: .}' schemas/transactions_proposed.avsc)
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST -H "Content-Type: application/vnd.schemaregistry.v1+json" --data "$PAYLOAD" http://localhost:8081/compatibility/subjects/payments.public.transactions-value/versions/latest)
          
          cat /tmp/response.json
          IS_COMPATIBLE=$(jq '.is_compatible' /tmp/response.json)
          
          if [ "$IS_COMPATIBLE" != "true" ]; then
            echo "SCHEMA BREAKING CHANGE DETECTED!"
            exit 1
          fi
          echo "Schema is fully compatible."